version: '3'
services:
  torano:
    #image: kooldev/php:8.3-nginx
    build:
      context: ./
      dockerfile: ./Dockerfile
    container_name: torano
    ports:
      - "2043:80"
    tty: true
    volumes:
      - ./:/app
  redis:
    container_name: redis
    image: 'redis:alpine'
    expose:
      - '6379:6379'
    volumes:
      - 'redis:/data'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      retries: 3
      timeout: 5s
volumes:
  redis:
    driver: local
